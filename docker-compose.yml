version: '1.0'

services:
    php:
        build: .
        volumes:
            - ./:/var/www/html
        container_name: web-ticketing
        networks:
            - nginx_network

    nginx:
        image: nginx
        ports:
            - "8080:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./public:/var/www/html/public
        container_name: nginx-web-ticketing
        networks:
            - nginx_network
    
networks:
    nginx_network:
        driver: bridge
